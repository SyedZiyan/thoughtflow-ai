version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: thoughtflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thoughtflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-thoughtflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thoughtflow_dev_password_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thoughtflow_user} -d ${POSTGRES_DB:-thoughtflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - thoughtflow-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thoughtflow-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-thoughtflow_user}:${POSTGRES_PASSWORD:-thoughtflow_dev_password_change_me}@db:5432/${POSTGRES_DB:-thoughtflow_db}
      STORAGE_DIR: /app/storage
      VIDEO_STORAGE_DIR: /app/storage/videos
      TEMP_STORAGE_DIR: /app/storage/temp
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/youtube/callback}
      YOUTUBE_UPLOAD_ENABLED: ${YOUTUBE_UPLOAD_ENABLED:-False}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-UTC}
    volumes:
      - video_storage:/app/storage
    ports:
      - "8000:8000"
    networks:
      - thoughtflow-network

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: thoughtflow-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-thoughtflow_user}:${POSTGRES_PASSWORD:-thoughtflow_dev_password_change_me}@db:5432/${POSTGRES_DB:-thoughtflow_db}
      STORAGE_DIR: /app/storage
      VIDEO_STORAGE_DIR: /app/storage/videos
      TEMP_STORAGE_DIR: /app/storage/temp
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      YOUTUBE_UPLOAD_ENABLED: ${YOUTUBE_UPLOAD_ENABLED:-False}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-UTC}
    volumes:
      - video_storage:/app/storage
    networks:
      - thoughtflow-network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: thoughtflow-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - thoughtflow-network

volumes:
  postgres_data:
    driver: local
  video_storage:
    driver: local

networks:
  thoughtflow-network:
    driver: bridge
