services:
  - type: web
    name: thoughtflow-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/v1/app/version
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: AI_PROVIDER
        value: mock
      - key: YOUTUBE_UPLOAD_ENABLED
        value: "True"
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata
